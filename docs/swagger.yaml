basePath: /
definitions:
  api.BatchScanRequest:
    properties:
      targets:
        items:
          $ref: '#/definitions/api.BatchTarget'
        type: array
    required:
    - targets
    type: object
  api.BatchScanResponse:
    properties:
      batch_id:
        type: string
      count:
        type: integer
      task_ids:
        items:
          type: string
        type: array
    type: object
  api.BatchTarget:
    properties:
      language:
        type: string
      local_path:
        type: string
      mode:
        description: simple | advanced
        type: string
      repo_url:
        type: string
    type: object
  api.LocalScanRequest:
    properties:
      changed_files_only:
        example: false
        type: boolean
      diff_base_ref:
        example: HEAD~1
        type: string
      language:
        example: go
        type: string
      local_path:
        example: /armur/repo
        type: string
    required:
    - local_path
    type: object
  api.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  api.ScanRequest:
    properties:
      language:
        example: go
        type: string
      repository_url:
        example: https://github.com/Armur-Ai/Armur-Code-Scanner
        type: string
      webhook_secret:
        example: my-hmac-secret
        type: string
      webhook_url:
        example: https://hooks.example.com/armur
        type: string
    type: object
  api.SignupRequest:
    properties:
      company_name:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - company_name
    - email
    - first_name
    - last_name
    - password
    type: object
  utils.ReportItem:
    properties:
      column:
        type: integer
      confidence:
        type: string
      file:
        type: string
      line:
        type: integer
      message:
        type: string
      owasp:
        type: string
      severity:
        type: string
      suggested_remediation:
        type: string
    type: object
  utils.SANSReportItem:
    properties:
      column:
        type: integer
      confidence:
        type: string
      cwe:
        type: string
      file:
        type: string
      line:
        type: integer
      message:
        type: string
      severity:
        type: string
      suggested_remediation:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a code scanner service API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: vibescan API
  version: "1.0"
paths:
  /api/v1/advanced-scan/repo:
    post:
      consumes:
      - application/json
      description: Enqueues an advanced scan task for a given repository URL and language.
      parameters:
      - description: Request body containing repository URL and language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully enqueued task
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to enqueue scan task
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a code scan on a repository with advanced scans.
      tags:
      - scan
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT token
      parameters:
      - description: Login Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: User Login
      tags:
      - Authentication
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Register a new user in the SaaS platform
      parameters:
      - description: Signup Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: User Signup
      tags:
      - Authentication
  /api/v1/progress/{task_id}:
    get:
      description: Streams scan progress via Server-Sent Events (SSE)
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE Stream
          schema:
            type: string
      summary: Task Progress
      tags:
      - Scan
  /api/v1/reports/owasp/{task_id}:
    get:
      description: Generates OWASP report from a specific task result using task ID.
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully generated OWASP report
          schema:
            items:
              $ref: '#/definitions/utils.ReportItem'
            type: array
        "404":
          description: Task result not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch task result
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get OWASP report for a task result.
      tags:
      - report
  /api/v1/reports/sans/{task_id}:
    get:
      description: Generates SANS report from a specific task result using task ID.
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully generated SANS report
          schema:
            items:
              $ref: '#/definitions/utils.SANSReportItem'
            type: array
        "404":
          description: Task result not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch task result
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get SANS report for a task result.
      tags:
      - report
  /api/v1/scan/{task_id}:
    delete:
      description: Cancels an in-progress scan task
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cancel Scan
      tags:
      - Scan
  /api/v1/scan/batch:
    post:
      consumes:
      - application/json
      description: Enqueues multiple scan tasks at once
      parameters:
      - description: Batch Scan Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BatchScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BatchScanResponse'
      summary: Batch Scan
      tags:
      - Scan
  /api/v1/scan/file:
    post:
      consumes:
      - multipart/form-data
      description: Enqueues a scan task for a given file.
      parameters:
      - description: File to be scanned
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Successfully enqueued task
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: No file part or no selected file
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create temp directory or Failed to save file
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a code scan on file.
      tags:
      - scan
  /api/v1/scan/local:
    post:
      consumes:
      - application/json
      description: Enqueues a scan task for a given local repository path and language.
      parameters:
      - description: Request body containing local path and language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LocalScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully enqueued task
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to enqueue scan task
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a code scan on a local repository.
      tags:
      - scan
  /api/v1/scan/repo:
    post:
      consumes:
      - application/json
      description: Enqueues a scan task for a given repository URL and language.
      parameters:
      - description: Request body containing repository URL and language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully enqueued task
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to enqueue scan task
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger a code scan on a repository.
      tags:
      - scan
  /api/v1/status/{task_id}:
    get:
      description: Get the status and results of a scan task by its ID.
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Output format (json, sarif)
        enum:
        - json
        - sarif
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved task result
          schema:
            additionalProperties: true
            type: object
      summary: Get task status and results.
      tags:
      - scan
  /api/v1/user/about:
    get:
      description: Returns the profile information of the currently authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get Current User Info
      tags:
      - Authentication
  /health:
    get:
      description: Returns the health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - System
  /ready:
    get:
      description: Returns the readiness status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness Check
      tags:
      - System
swagger: "2.0"
