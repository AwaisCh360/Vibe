version: "3.8"

services:
  db:
    image: postgres:15
    container_name: armur_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: armur
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: armur_dev_redis
    ports:
      - "6379:6379"

  api:
    image: ghcr.io/awaisch360/vibescan:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.dev
    container_name: armur_dev_api
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=armur
      - REDIS_ADDR=redis:6379
    ports:
      - "4500:4500"
    depends_on:
      - db
      - redis
